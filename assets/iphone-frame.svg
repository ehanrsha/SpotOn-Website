<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958 1936" fill="none">
  <!-- iPhone 17 Pro Max silhouette. The screen area (rounded rect
       x38 y44 w882 h1846 r108) is transparent so video shows through. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#efefed"/>
      <stop offset="0.5" stop-color="#d5d5d3"/>
      <stop offset="1"   stop-color="#e6e6e4"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0e0de"/>
      <stop offset="1" stop-color="#b7b7b5"/>
    </linearGradient>
  </defs>

  <!-- Side buttons (drawn first so the body overlaps their inner edge) -->
  <g fill="url(#btn)" stroke="#9b9b99" stroke-width="1">
    <rect x="0.5" y="421" width="10" height="86"  rx="4"/>   <!-- action -->
    <rect x="0.5" y="584" width="10" height="138" rx="4"/>   <!-- vol up -->
    <rect x="0.5" y="756" width="10" height="138" rx="4"/>   <!-- vol down -->
    <rect x="947.5" y="624" width="10" height="222" rx="4"/> <!-- power -->
  </g>

  <!-- Titanium outer band (ring: outer edge minus bezel edge) -->
  <path fill="url(#band)" stroke="#a3a3a1" stroke-width="1.5" fill-rule="evenodd" d="
    M158,4 H792 A150,150 0 0 1 942,154 V1782 A150,150 0 0 1 792,1932 H158 A150,150 0 0 1 8,1782 V154 A150,150 0 0 1 158,4 Z
    M158,17 H792 A137,137 0 0 1 929,154 V1782 A137,137 0 0 1 792,1919 H158 A137,137 0 0 1 21,1782 V154 A137,137 0 0 1 158,17 Z"/>

  <!-- Black bezel (ring: bezel edge minus screen cutout) -->
  <path fill="#0b0b0c" fill-rule="evenodd" d="
    M158,17 H792 A137,137 0 0 1 929,154 V1782 A137,137 0 0 1 792,1919 H158 A137,137 0 0 1 21,1782 V154 A137,137 0 0 1 158,17 Z
    M146,44 H812 A108,108 0 0 1 920,152 V1782 A108,108 0 0 1 812,1890 H146 A108,108 0 0 1 38,1782 V152 A108,108 0 0 1 146,44 Z"/>

  <!-- Dynamic island + camera -->
  <rect x="349" y="72" width="260" height="80" rx="40" fill="#050506"/>
  <circle cx="575" cy="112" r="10"  fill="#16161a"/>
  <circle cx="572" cy="109" r="3.5" fill="#2e2e38"/>
</svg>
