<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotOn — Making parking infinite.</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       TWEAKABLE NUMBERS — change these to taste.
       Every value that controls phone size / clipping / animation
       is in this block. Nothing else needs editing.
       ═══════════════════════════════════════════════════════════ */
    :root {
      /* ── Desktop (≥ 1024px) ─────────────────────────────────── */
      /* Phone video height. Bigger = phone feels more immersive.   */
      --phone-height-desktop: 105vh;

      /* (Screen corner curvature now comes from the device frame
         geometry — see the .phone-frame rules below.) */

      /* How far the phone is pushed below the fold.
         This is *also* the resting translateY of the slide-up.
         At 95vh phone × 25vh clip ≈ 26 % bottom-clipped.            */
      --phone-clip-desktop:   25vh;

      /* Desktop side gap between the phone and each text group. */
      --phone-side-gap-desktop: clamp(32px, 5vw, 100px);

      /* ── Mobile (< 1024px) ──────────────────────────────────── */
      /* Phone width as a % of screen. Height comes from the
         video's natural aspect ratio. */
      --phone-width-mobile:   65vw;

      /* Vertical gap between the description text and the video. */
      --phone-text-gap:       20px;

      /* Empty scrollable space underneath the phone on mobile. */
      --phone-bottom-space-mobile: 64px;

      /* Extra scroll clearance so the fixed mobile download bar does not cover the phone. */
      --mobile-download-clearance: 70px;

      /* ── Slide-up animation ─────────────────────────────────── */
      /* Duration of the rise.                                       */
      --rise-duration: 1.2s;
      /* Easing — smooth ease-out, no overshoot, no bounce.
         Swap to `ease-out` or `linear` if you want.                 */
      --rise-easing:   cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ─── Fonts ──────────────────────────────────────────────── */
    @font-face {
      font-family: 'Switzer';
      src: url('Fonts/Switzer-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Switzer';
      src: url('Fonts/Switzer-Semibold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Switzer-Light';
      src: url('Fonts/Switzer-Light.ttf') format('truetype');
      font-style: normal;
    }
    @font-face {
      font-family: 'Switzer-Semibold';
      src: url('Fonts/Switzer-Semibold.ttf') format('truetype');
      font-style: normal;
    }

    /* ─── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Switzer', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════════════
       DESKTOP — 3-column grid (text left | video centre | text right)
       Per Figma 366-2.  Hero is full viewport with overflow:hidden
       so any phone that sticks out below gets clipped.
    ═══════════════════════════════════════════════════════════ */
    .hero {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* ── Branding (top-left) ──────────────────────────────────── */
    .nav {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: clamp(20px, 3vh, 40px) 0 0 clamp(20px, 3vw, 48px);
      animation: blurUp 0.9s ease-out 0.05s backwards;
    }
    .nav-icon {
      width: clamp(28px, 2.4vw, 40px);
      height: clamp(28px, 2.4vw, 40px);
      border-radius: 50%;
      object-fit: cover;
      transition:
        box-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        filter 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .nav-name {
      font-family: 'Switzer-Light', sans-serif;
      font-size: clamp(16px, 1.5vw, 22px);
      letter-spacing: -0.02em;
      transition: text-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .nav-name strong { font-family: 'Switzer-Semibold', sans-serif; font-weight: normal; }
    .nav:hover .nav-icon {
      filter: brightness(1.08);
      box-shadow: 0 22px 44px rgba(255, 255, 255, 0.18);
    }
    .nav:hover .nav-name {
      text-shadow:
        0 10px 24px rgba(255, 255, 255, 0.24),
        0 22px 44px rgba(255, 255, 255, 0.18);
    }

    /* ── Tagline (left column, bottom-aligned) ────────────────── */
    .left {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 0 clamp(72px, 16vh, 150px) clamp(20px, 3vw, 48px);
      animation: blurUp 1s ease-out 0.35s backwards;
    }
    .tagline {
      font-size: clamp(26px, 4vw, 68px);
      font-weight: 300;
      line-height: 1.06;
      letter-spacing: -0.025em;
    }
    .tagline em {
      border-radius: 0.16em;
      cursor: default;
      font-style: normal;
      font-weight: 600;
      transition:
        text-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        filter 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tagline em:hover {
      filter: brightness(1.08);
      text-shadow:
        0 10px 24px rgba(255, 255, 255, 0.24),
        0 22px 44px rgba(255, 255, 255, 0.18);
    }

    /* ── Phone column (centre, spans both rows, bottom-anchored) ─
       align-self: end pins the phone to the bottom of the 100vh
       grid area. The phoneRise animation slides it up from off-
       screen and stops at translateY(--phone-clip-desktop) — so
       that exact amount lives below the viewport and is clipped
       by .hero { overflow: hidden }.                              */
    .phone-col {
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: end;
      display: flex;
      justify-content: center;
      padding: 0 var(--phone-side-gap-desktop);
    }

    .phone-inner {
      opacity: 0;
      animation: phoneRise var(--rise-duration) var(--rise-easing) 0.1s forwards;
      will-change: transform, opacity;
    }

    /* Device frame: a positioning box with the iPhone mockup
       (assets/iphonemockup.png, 1758×3664) layered over the video.
       The video is sized to the mockup's transparent screen cutout —
       measured at x76 y84 w1608 h3496, corner radius 251 — so the
       percentages below derive from those numbers. The video needs its
       own border-radius: square corners would show through the
       cutout's transparent rounded corners. */
    .phone-frame {
      position: relative;
      height: var(--phone-height-desktop);
      aspect-ratio: 1758 / 3664;
    }

    .phone-frame-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    .phone-video {
      display: block;
      position: absolute;
      left: 4.32%;   /* 76 / 1758 */
      top: 2.29%;    /* 84 / 3664 */
      width: 91.47%; /* 1608 / 1758 */
      height: 95.42%;/* 3496 / 3664 */
      object-fit: cover;
      /* 251 / 1608  ×  251 / 3496 — elliptical % keeps a circular corner */
      border-radius: 15.61% / 7.18%;
      z-index: 0;
    }

    /* ── Right column: description + button (bottom-aligned) ──── */
    .right {
      grid-column: 3;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(16px, 2.5vh, 28px);
      padding: 0 clamp(20px, 3vw, 64px) clamp(72px, 16vh, 150px) 0;
    }

    .description {
      font-size: clamp(13px, 1.05vw, 18px);
      font-weight: 300;
      line-height: 1.72;
      color: rgba(255, 255, 255, 0.75);
      animation: blurUp 1s ease-out 0.65s backwards;
    }

    /* ─── Download Button (desktop) ─────────────────────────── */
    .dl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fff;
      color: #000;
      border: none;
      outline: none;
      border-radius: 999px;
      padding: clamp(12px, 1.2vh, 18px) clamp(20px, 1.8vw, 32px);
      font-family: 'Switzer', sans-serif;
      font-weight: 300;
      font-size: clamp(13px, 0.95vw, 16px);
      letter-spacing: -0.01em;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      width: fit-content;
      animation: blurUp 1s ease-out 0.85s backwards;
      transition:
        transform  0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }
    .dl-btn:hover  { transform: translateY(-7px) scale(1.04); box-shadow: 0 22px 44px rgba(255,255,255,0.18); }
    .dl-btn:active { transform: translateY(-2px) scale(1.01); transition-duration: 0.2s; }
    .dl-btn svg    { width: 15px; height: 15px; flex-shrink: 0; }
    .dl-btn strong { font-family: 'Switzer-Semibold', sans-serif; font-weight: normal; }

    /* ─── Keyframes ──────────────────────────────────────────── */

    /* Phone slide-up — desktop.
       Ends at translateY(--phone-clip-desktop) so that amount
       hangs below the hero edge and gets clipped.                */
    @keyframes phoneRise {
      from { opacity: 0; transform: translateY(110vh); }
      to   { opacity: 1; transform: translateY(var(--phone-clip-desktop)); }
    }

    /* Phone slide-up — mobile.
       Phone stays in normal flow; we just slide it up into place. */
    @keyframes phoneRiseMobile {
      from { opacity: 0; transform: translateY(60vh); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @keyframes blurUp {
      from { opacity: 0; filter: blur(12px); transform: translateY(12px); }
      to   { opacity: 1; filter: none;       transform: translateY(0);    }
    }

    /* ═══════════════════════════════════════════════════════════
       MOBILE  (< 1024px)
       Single-column flex.  Order: nav → tagline → description →
       video.  Fixed download button stays pinned to the viewport.
       Video width = --phone-width-mobile, height = aspect-ratio.
       Page scrolls normally so the full phone can be viewed.
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 1023px) {
      .hero {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        height: auto;
        overflow: visible;
        padding-bottom: var(--mobile-download-clearance);
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      /* unwind grid placement, set flex order */
      .nav      { order: 1; grid-column: unset; grid-row: unset; padding: 28px 24px 0; }
      .left     { order: 2; grid-column: unset; grid-row: unset; align-items: flex-start; justify-content: flex-start; padding: 24px 24px 0; }
      .right    { order: 3; grid-column: unset; grid-row: unset; justify-content: flex-start; padding: 12px 24px 0; gap: 0; }
      .phone-col{
        order: 4;
        grid-column: unset;
        grid-row: unset;
        align-self: stretch;
        justify-content: center;
        align-items: flex-start;
        padding: 0 0 var(--phone-bottom-space-mobile);
        margin-top: var(--phone-text-gap);
        flex: 0 0 auto;
        min-height: 0;
        overflow: visible;
      }

      .dl-btn--desktop { display: none !important; }

      .tagline {
        font-size: clamp(34px, 10vw, 58px);
      }
      .description {
        font-size: clamp(15px, 4vw, 19px);
        line-height: 1.5;
      }

      .phone-inner {
        animation: phoneRiseMobile var(--rise-duration) var(--rise-easing) 0.1s forwards;
      }

      .phone-frame {
        height: auto;
        width: var(--phone-width-mobile);
      }
    }

    /* ─── Mobile fixed download button (DO NOT TOUCH) ─────────── */
    .dl-btn--mobile {
      display: none;
      position: fixed;
      bottom: 14px;
      left: 10vw;
      right: 10vw;
      width: auto;
      max-width: none;
      font-size: clamp(13px, 3.6vw, 16px);
      padding: 12px 20px;
      white-space: nowrap;
      gap: 6px;
      transition:
        transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dl-btn--mobile:hover  { transform: translateY(-6px) scale(1.02); box-shadow: 0 18px 36px rgba(255, 255, 255, 0.18); }
    .dl-btn--mobile:active { transform: translateY(-2px) scale(1.01); transition-duration: 0.2s; }

    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: 0;
      color: #fff;
      cursor: pointer;
      padding: 0;
    }
    .menu-toggle span {
      position: relative;
      width: 24px;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
    }
    .menu-toggle span::before,
    .menu-toggle span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 24px;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
    }
    .menu-toggle span::before { top: -7px; }
    .menu-toggle span::after { top: 7px; }

    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #DCDBD8;
      color: #000;
    }
    .mobile-menu.is-open {
      display: flex;
    }
    .menu-close {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: transparent;
      border: 0;
      color: #000;
      cursor: pointer;
      font-family: 'Switzer', sans-serif;
      font-size: 42px;
      font-weight: 300;
      line-height: 1;
    }
    .menu-message {
      align-self: center;
      width: 100%;
      padding: 0 28px;
      text-align: center;
      font-size: clamp(34px, 10vw, 72px);
      font-weight: 300;
      line-height: 1.05;
    }
    body.menu-open {
      overflow: hidden;
    }

    @media (max-width: 1023px) {
      .dl-btn--mobile { display: inline-flex; }
      .menu-toggle {
        position: fixed;
        top: 20px;
        right: 18px;
        z-index: 40;
        display: inline-flex;
      }
    }

    /* ─── Very wide screens ──────────────────────────────────── */
    @media (min-width: 1600px) {
      .hero { max-width: 1600px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="hero">

    <!-- ── Branding (top-left) ─────────────────────────────── -->
    <nav class="nav">
      <img class="nav-icon" src="assets/spoton-logo.png" alt="SpotOn">
      <span class="nav-name"><strong>Spot</strong>On</span>
    </nav>

    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
      <span aria-hidden="true"></span>
    </button>

    <!-- ── Tagline (left column) ───────────────────────────── -->
    <div class="left">
      <h1 class="tagline">Making <em>parking</em><br>infinite.</h1>
    </div>

    <!-- ── Phone video (centre column) ─────────────────────── -->
    <div class="phone-col">
      <div class="phone-inner">
        <div class="phone-frame">
          <video class="phone-video" autoplay loop muted playsinline>
            <source src="assets/demo.webm" type="video/webm">
          </video>
          <img class="phone-frame-img" src="assets/iphonemockup.png" alt="" aria-hidden="true">
        </div>
      </div>
    </div>

    <!-- ── Description + desktop button (right column) ─────── -->
    <div class="right">
      <p class="description">
        Get paid to list your front driveway,<br>
        and find spots anywhere in the world.<br>
        Rent for hours, days, or even months.<br>
        Simplicity is how we believe parking<br>
        should work.
      </p>
      <a href="waitlist.html" class="dl-btn dl-btn--desktop" aria-label="Join the SpotOn waitlist">
        Join the Waitlist
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
        </svg>
      </a>
    </div>

  </div>

  <!-- Mobile download button — direct body child for fixed positioning -->
  <a href="waitlist.html" class="dl-btn dl-btn--mobile" aria-label="Join the SpotOn waitlist">
    <span>Join the <strong>Spot</strong>On Waitlist</span>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
    </svg>
  </a>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <button class="menu-close" type="button" aria-label="Close menu">x</button>
    <p class="menu-message">in stealth mode, more news to come soon</p>
  </div>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileMenu = document.querySelector('.mobile-menu');
    const menuClose = document.querySelector('.menu-close');

    function setMenuOpen(isOpen) {
      mobileMenu.classList.toggle('is-open', isOpen);
      document.body.classList.toggle('menu-open', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      mobileMenu.setAttribute('aria-hidden', String(!isOpen));
    }

    menuToggle.addEventListener('click', () => setMenuOpen(true));
    menuClose.addEventListener('click', () => setMenuOpen(false));
  </script>

</body>
</html>
